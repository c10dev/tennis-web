<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TennisSim</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="/fonts/nunito-600.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Lilita One is the game's display face; the dev replay page (?seed=) never uses it, so it is preloaded only here.
      if (!new URLSearchParams(location.search).has('seed')) {
        const link = Object.assign(document.createElement('link'), { rel: 'preload', href: '/fonts/lilita-one-400.woff2', as: 'font', type: 'font/woff2' });
        link.crossOrigin = '';
        document.head.append(link);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
